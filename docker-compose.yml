# Run the DMAG OKR suite locally: Odoo 17 Community + PostgreSQL.
#   1. docker compose up -d db
#   2. docker compose run --rm odoo odoo -d dmag_okr -i okr_scale_demo --load-language=vi_VN --without-demo=all --stop-after-init
#   3. docker compose up -d   then open http://localhost:8069  (admin / admin)
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - okr-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons:ro
      - ./deploy/odoo.conf:/etc/odoo/odoo.conf:ro
      - okr-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  okr-db:
  okr-data:
