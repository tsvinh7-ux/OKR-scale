# DMAG OKR suite on Odoo 17 Community.
#
#   docker compose up -d            -> http://localhost:8069  (admin / admin)
#   docker compose logs -f odoo     -> follow the first install (2-4 minutes)
#   docker compose run --rm tests   -> run every automated test
#   docker compose down -v          -> remove everything (database included)
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - okr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  odoo:
    image: odoo:17.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      OKR_DB: dmag_okr
      OKR_UPDATE: "${OKR_UPDATE:-0}"
    entrypoint: ["/bin/bash", "/mnt/extra-addons/deploy/entrypoint.sh"]
    volumes:
      - ./:/mnt/extra-addons:ro
      - ./deploy/odoo.conf:/etc/odoo/odoo.conf:ro
      - okr-data:/var/lib/odoo
    restart: unless-stopped

  tests:
    image: odoo:17.0
    profiles: ["tests"]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/mnt/extra-addons/deploy/run_tests.sh"]
    volumes:
      - ./:/mnt/extra-addons:ro
      - ./deploy/odoo.conf:/etc/odoo/odoo.conf:ro

volumes:
  okr-db:
  okr-data:
